<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#fdf8ef">
  <link rel="manifest" href="./sharelog.webmanifest">
  <title>Share Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#fdf8ef;--card:#fffdf7;--ink:#2f2a28;--sub:#776b63;--line:#8d6c9f;--blue:#b9dced;--pink:#f2c8d2;--green:#cfe3c7;--yellow:#f5df9a;--grid:#dfd2c4;--shadow:3px 3px 0 rgba(47,42,40,.12);--nav:72px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(rgba(141,108,159,.12) 1px,transparent 1px);background-size:18px 18px}
    button,input,select{font:inherit;color:inherit}button{cursor:pointer}
    .app{width:min(100%,430px);margin:0 auto;padding:10px 10px calc(var(--nav) + 28px)}
    .sticky{position:sticky;top:0;z-index:30;background:rgba(253,248,239,.96);backdrop-filter:blur(10px);padding:8px 0}
    .top{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}
    h1{margin:0;font-family:'Gaegu';font-size:34px;line-height:1}.sub{margin:2px 0 0;color:var(--sub);font-size:12px}
    .icon{width:40px;height:40px;border:1.6px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-family:'Gaegu';font-size:23px;display:grid;place-items:center}
    .page{display:none}.page.on{display:block}
    .title{display:flex;align-items:end;justify-content:space-between;margin:10px 2px 8px}.title h2{margin:0;font-family:'Gaegu';font-size:32px}.title small{color:var(--sub);font-size:11px}
    .card{margin:10px 0;padding:13px;border:1.8px solid var(--line);border-radius:22px;background:rgba(255,253,247,.88);box-shadow:var(--shadow)}
    .divTitle{font-family:'Gaegu';font-size:24px;margin:0 0 8px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mini{border:1.5px solid var(--line);border-radius:17px;background:var(--card);padding:10px;box-shadow:2px 2px 0 rgba(47,42,40,.1);text-align:left}
    .mini h3{margin:0 0 4px;font-family:'Gaegu';font-size:23px}.mini p{margin:0;color:var(--sub);font-size:12px;line-height:1.45}.blue{background:linear-gradient(transparent 52%,var(--blue) 0)}.pink{background:linear-gradient(transparent 52%,var(--pink) 0)}.green{background:linear-gradient(transparent 52%,var(--green) 0)}
    .monthBar{position:sticky;top:60px;z-index:25;display:grid;grid-template-columns:40px 1fr auto 40px;gap:7px;align-items:center;margin:9px 0;padding:8px;border:1.7px solid var(--line);border-radius:19px;background:rgba(255,253,247,.96);box-shadow:2px 2px 0 rgba(47,42,40,.1)}
    .monthBtn,.todayBtn{height:35px;border:1.5px solid var(--line);border-radius:13px;background:var(--card);box-shadow:2px 2px 0 rgba(47,42,40,.1);font-family:'Gaegu';font-size:24px}.todayBtn{font-size:16px;border-radius:999px;padding:0 9px;white-space:nowrap}
    .monthTitle{text-align:center;font-family:'Gaegu';font-size:29px;font-weight:700;line-height:1}
    .cal,.moneyCal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;border:1.7px solid var(--grid);border-radius:20px;overflow:hidden;background:var(--grid);box-shadow:var(--shadow)}
    .wd,.day,.moneyDay{background:var(--card)}.wd{height:26px;display:grid;place-items:center;font-family:'Patrick Hand';font-size:15px}.wd.weekend{color:#b96874}
    .day,.moneyDay{position:relative;min-height:58px;padding:4px;overflow:hidden;border:0;text-align:left}.day.mute,.moneyDay.mute{background:#f4ede3;color:#aaa096}.day.today,.moneyDay.today{outline:2px solid rgba(141,108,159,.55);outline-offset:-2px}
    .num,.moneyNum{position:absolute;top:3px;left:5px;font-family:'Gaegu';font-size:17px;font-weight:700;z-index:3}
    .dots{position:absolute;left:6px;right:6px;bottom:4px;display:flex;gap:3px}.dot{width:7px;height:7px;border:1px solid rgba(47,42,40,.45);border-radius:50%;background:var(--blue)}
    .detail h4{margin:0 0 8px;font-family:'Gaegu';font-size:24px}.scheduleItem{display:grid;grid-template-columns:48px 1fr auto;gap:8px;margin-bottom:8px;font-size:13px}.time{font-family:'Gaegu';font-size:16px;font-weight:700}.time.empty{display:inline-flex;justify-content:center;align-items:center;min-width:34px;border:1px solid rgba(47,42,40,.38);border-radius:999px;background:#fff3d8;color:#7a6a55;font-size:14px}
    .tag{display:inline-flex;border:1px solid rgba(47,42,40,.45);border-radius:999px;padding:1px 6px;background:#fffaf2;color:var(--sub);font-size:10px;white-space:nowrap}.list{list-style:none;margin:0;padding:0}.list li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid rgba(47,42,40,.12);font-size:13px}.list li:last-child{border-bottom:0}.amount{font-family:'Gaegu';font-size:19px;white-space:nowrap}
    .moneySummary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{padding:10px;border:1.5px solid var(--line);border-radius:16px;background:rgba(255,255,255,.35)}.box span{display:block;color:var(--sub);font-size:12px}.box strong{display:block;margin-top:3px;font-family:'Gaegu';font-size:24px}.income{color:#4d7f8c}.expense{color:#b55b5b}.moneyDay.incomeOnly{background:#d8edf7}.moneyDay.expenseOnly{background:#f7d8df}.moneyDay.both{background:linear-gradient(135deg,#d8edf7 0 50%,#f7d8df 50%)}
    .fab{position:fixed;right:18px;bottom:calc(var(--nav) + 18px);z-index:44;width:58px;height:58px;border:1.8px solid var(--line);border-radius:50%;background:var(--yellow);box-shadow:var(--shadow);font-family:'Gaegu';font-size:34px}
    .nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(calc(100vw - 20px),410px);height:var(--nav);display:grid;grid-template-columns:repeat(3,1fr);padding:6px;background:rgba(255,253,247,.95);border:1.8px solid var(--line);border-radius:22px;box-shadow:0 8px 24px rgba(47,42,40,.12),3px 3px 0 rgba(47,42,40,.16);z-index:45}
    .navBtn{border:0;background:transparent;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 0}.navBtn svg{width:21px;height:21px;stroke:var(--line);stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}.navBtn span{font-family:'Patrick Hand';font-size:clamp(11px,3.1vw,15px)}.navBtn.on{background:linear-gradient(transparent 22%,rgba(244,217,139,.78) 22% 78%,transparent 78%)}
    .sheetBg{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:rgba(47,42,40,.22)}.sheetBg[hidden]{display:none}.sheet{width:min(100%,430px);max-height:min(86svh,720px);overflow:auto;background:var(--card);border:1.8px solid var(--line);border-radius:24px 24px 18px 18px;box-shadow:0 -12px 34px rgba(47,42,40,.18);padding:10px 14px 16px}.handle{width:48px;height:5px;border-radius:999px;background:rgba(47,42,40,.25);margin:0 auto 10px}.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sheetHead h3{margin:0;font-family:'Gaegu';font-size:28px}.form{display:grid;gap:9px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:4px}.field label{font-family:'Gaegu';font-size:18px}.field input,.field select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
    .save,.cancel{border:1.7px solid var(--line);border-radius:14px;padding:11px 12px;font-family:'Gaegu';font-size:22px}.save{background:var(--yellow);box-shadow:2px 2px 0 rgba(47,42,40,.16)}.cancel{background:var(--card)}.note{margin:0;color:var(--sub);font-size:12px;line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  </style>
</head>
<body>
<div class="app">
  <div class="sticky"><div class="top"><div><h1>Share Log</h1><p class="sub" id="todayText">schedule via worker · money local</p></div><button class="icon" id="openSettings">☰</button></div></div>
  <section id="home" class="page on"><div class="title"><h2>Home</h2><small>today</small></div><article class="card"><div class="divTitle">오늘 요약</div><div class="grid2"><button class="mini jump" data-target="calendar"><h3><span class="blue">캘린더</span></h3><p id="homeCalendar">오늘 일정</p></button><button class="mini jump" data-target="money"><h3><span class="pink">가계부</span></h3><p id="homeMoney">로컬 가계부</p></button><button class="mini" id="backupQuick"><h3><span class="green">백업</span></h3><p>가계부 JSON 저장</p></button><button class="mini" id="reloadCalendar"><h3><span class="blue">동기화</span></h3><p>일정 다시 불러오기</p></button></div></article><article class="card"><div class="divTitle">오늘 일정</div><div id="homeSchedules"></div></article></section>
  <section id="calendar" class="page"><div class="title"><h2>Calendar</h2><small>schedule only</small></div><div class="monthBar"><button class="monthBtn" id="prevCal">‹</button><div class="monthTitle" id="calTitle"></div><button class="todayBtn" id="todayCal">오늘</button><button class="monthBtn" id="nextCal">›</button></div><p class="note" id="syncStatus">일정만 불러옵니다.</p><article class="card"><div class="cal" id="calGrid"></div></article><article class="card"><div class="detail" id="dayDetail"></div></article></section>
  <section id="money" class="page"><div class="title"><h2>Money</h2><small>local only</small></div><div class="monthBar"><button class="monthBtn" id="prevMoney">‹</button><div class="monthTitle" id="moneyTitle"></div><button class="todayBtn" id="todayMoney">오늘</button><button class="monthBtn" id="nextMoney">›</button></div><article class="card"><div class="moneySummary"><div class="box"><span>수입</span><strong class="income" id="moneyIncome">0</strong></div><div class="box"><span>지출</span><strong class="expense" id="moneyExpense">0</strong></div><div class="box"><span>잔액</span><strong id="moneyBalance">0</strong></div><div class="box"><span>낭비</span><strong class="expense" id="moneyWaste">0</strong></div></div></article><article class="card"><div class="moneyCal" id="moneyCal"></div></article><article class="card"><div class="divTitle">이번 달 기록</div><ul class="list" id="moneyList"></ul></article><button class="fab" id="openMoney">＋</button></section>
</div>
<nav class="nav"><button class="navBtn on" data-target="home"><svg viewBox="0 0 24 24"><path d="M5 5.5h14v13H5z"/><path d="M8 9h8M8 12h5M8 15h7"/></svg><span>Home</span></button><button class="navBtn" data-target="calendar"><svg viewBox="0 0 24 24"><path d="M5 6h14v13H5z"/><path d="M8 4v4M16 4v4M5 10h14"/></svg><span>Calendar</span></button><button class="navBtn" data-target="money"><svg viewBox="0 0 24 24"><path d="M5 8h14v10H5z"/><path d="M7 8V6h9v2"/><path d="M15.5 13.5h2"/></svg><span>Money</span></button></nav>
<div class="sheetBg" id="moneySheet" hidden><section class="sheet"><div class="handle"></div><div class="sheetHead"><h3>가계부 입력</h3><button class="icon" id="closeMoney">×</button></div><form class="form" id="moneyForm"><div class="row2"><div class="field"><label>유형</label><select id="moneyType"><option value="expense">지출</option><option value="income">수입</option></select></div><div class="field"><label>날짜</label><input id="moneyDate" type="date" required></div></div><div class="field"><label>내용</label><input id="moneyTitleInput" required autocomplete="off"></div><div class="field"><label>금액</label><input id="moneyAmount" inputmode="numeric" required autocomplete="off"></div><div class="row2"><div class="field"><label>분류</label><input id="moneyCategory" autocomplete="off"></div><div class="field"><label>카드/계좌</label><input id="moneyCard" autocomplete="off"></div></div><label class="tag"><input type="checkbox" id="moneyWasteCheck"> 낭비 지출</label><div class="actions"><button class="cancel" type="button" id="deleteMoney" hidden>삭제</button><button class="save" type="submit">저장</button></div></form></section></div>
<div class="sheetBg" id="settingsSheet" hidden><section class="sheet"><div class="handle"></div><div class="sheetHead"><h3>설정</h3><button class="icon" id="closeSettings">×</button></div><div class="form"><div class="field"><label>Worker 앞부분</label><input id="workerName" placeholder="paperlog"></div><div class="field"><label>Cloudflare ID</label><input id="workerId" placeholder="hyunra94"></div><div class="field"><label>SECRET Key</label><input id="secretKey" type="password"></div><button class="save" id="saveSettings">설정 저장</button><button class="cancel" id="loadCalendarNow">일정 불러오기</button><button class="save" id="exportMoney">가계부 백업 내보내기</button><label class="cancel" style="text-align:center">가계부 백업 가져오기<input type="file" id="importMoney" accept="application/json" hidden></label><p class="note">캘린더는 기존 Worker에서 일정 DB만 불러오고, 가계부는 이 브라우저에 저장됩니다.</p></div></section></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const MONEY_STORE='sharelog.money.v1', CONFIG_STORE='sharelog.paper.config.v1', SECRET_STORE='sharelog.paper.secret.v1';
const today=(()=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])})();
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7), won=n=>Number(n||0).toLocaleString('ko-KR');
let schedules=[], calView=new Date(today.getFullYear(),today.getMonth(),1), selected=key(today), moneyView=new Date(today.getFullYear(),today.getMonth(),1), money=loadMoney(), editingMoney='';
function loadMoney(){try{return JSON.parse(localStorage.getItem(MONEY_STORE)||'[]')}catch{return []}}
function saveMoney(){localStorage.setItem(MONEY_STORE,JSON.stringify(money));renderMoney();renderHome()}
function getConfig(){let c={};try{c=JSON.parse(localStorage.getItem(CONFIG_STORE)||'{}')}catch{}return {...c,secret:localStorage.getItem(SECRET_STORE)||''}}
function setConfig(c){localStorage.setItem(CONFIG_STORE,JSON.stringify({workerName:c.workerName,workerId:c.workerId}));localStorage.setItem(SECRET_STORE,c.secret)}
function apiBase(){const c=getConfig();if(!c.workerName||!c.workerId)throw new Error('Worker 설정이 필요합니다.');return `https://${c.workerName}.${c.workerId}.workers.dev`}
function paperFetch(path){const c=getConfig();if(!c.secret)throw new Error('SECRET Key가 필요합니다.');return fetch(apiBase()+path,{headers:{'x-paper-key':c.secret}})}
function page(id){$$('.page').forEach(p=>p.classList.toggle('on',p.id===id));$$('.navBtn').forEach(b=>b.classList.toggle('on',b.dataset.target===id));scrollTo({top:0,behavior:'smooth'})}
function monthKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function monthTitle(d){return `${d.getFullYear()}년 ${d.getMonth()+1}월`}
function range(view){const f=new Date(view.getFullYear(),view.getMonth(),1), t=new Date(view.getFullYear(),view.getMonth()+1,0);return {from:key(f),to:key(t)}}
function byDate(k){return schedules.filter(x=>k>=x.date&&k<=(x.endDate||x.date))}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
async function loadSchedules(silent=false){try{if(!silent)$('#syncStatus').textContent='일정 불러오는 중...';const r=range(calView), qs=new URLSearchParams({from:r.from,to:r.to,includeCanceled:'false'});const res=await paperFetch(`/api/calendar?${qs}`);const data=await res.json().catch(()=>({}));if(!res.ok||data.ok===false)throw new Error(data.message||data.error||'일정 불러오기 실패');schedules=(data.schedules||[]).filter(x=>x.date).map(x=>({id:x.id,url:x.url,date:String(x.date).slice(0,10),endDate:String(x.endDate||x.date).slice(0,10),time:x.time||'',title:x.title||'(제목 없음)',category:x.category||x.subject||'일정',canceled:!!x.canceled,projectIds:x.projectIds||[]}));renderCalendar();renderHome();$('#syncStatus').textContent=`일정 ${schedules.length}개 불러옴`;}catch(e){$('#syncStatus').textContent='불러오기 실패: '+e.message;console.warn(e)}}
function renderHome(){const d=byDate(key(today));$('#homeCalendar').textContent=`오늘 일정 ${d.length}개`;$('#homeSchedules').innerHTML=d.length?d.map(scheduleHTML).join(''):'<p class="note">오늘 일정이 없어요.</p>';const m=money.filter(x=>x.date&&x.date.slice(0,7)===monthKey(today));const inc=m.filter(x=>x.type==='income').reduce((a,b)=>a+Number(b.amount||0),0), exp=m.filter(x=>x.type==='expense').reduce((a,b)=>a+Number(b.amount||0),0);$('#homeMoney').innerHTML=`수입 ${won(inc)}원<br>지출 ${won(exp)}원`}
function scheduleHTML(x){return `<div class="scheduleItem"><span class="time ${x.time?'':'empty'}">${x.time||'종일'}</span><span>${esc(x.title)} <span class="tag">${esc(x.category)}</span></span>${x.url?`<a href="${x.url}" target="_blank" rel="noopener">↗</a>`:'<span></span>'}</div>`}
function renderCalendar(){const root=$('#calGrid');$('#calTitle').textContent=monthTitle(calView);root.innerHTML='';['mon','tue','wed','thu','fri','sat','sun'].forEach(x=>root.insertAdjacentHTML('beforeend',`<div class="wd ${x==='sat'||x==='sun'?'weekend':''}">${x}</div>`));const first=new Date(calView.getFullYear(),calView.getMonth(),1),start=new Date(first);start.setDate(first.getDate()-((first.getDay()+6)%7));for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d), v=byDate(k);root.insertAdjacentHTML('beforeend',`<button class="day ${d.getMonth()!==calView.getMonth()?'mute':''} ${k===key(today)?'today':''}" data-date="${k}"><span class="num">${d.getDate()}</span><div class="dots">${v.length?'<span class="dot"></span>':''}</div></button>`)}renderDetail()}
function renderDetail(){const v=byDate(selected), d=new Date(selected+'T00:00:00');$('#dayDetail').innerHTML=`<h4>${d.getMonth()+1}/${d.getDate()}</h4>${v.length?v.map(scheduleHTML).join(''):'<p class="note">일정이 없어요.</p>'}`}
function renderMoney(){const m=money.filter(x=>x.date&&x.date.slice(0,7)===monthKey(moneyView));$('#moneyTitle').textContent=monthTitle(moneyView);const inc=m.filter(x=>x.type==='income').reduce((a,b)=>a+Number(b.amount||0),0), exp=m.filter(x=>x.type==='expense').reduce((a,b)=>a+Number(b.amount||0),0), waste=m.filter(x=>x.type==='expense'&&x.waste).reduce((a,b)=>a+Number(b.amount||0),0);$('#moneyIncome').textContent='+'+won(inc);$('#moneyExpense').textContent='-'+won(exp);$('#moneyBalance').textContent=(inc-exp>=0?'+':'-')+won(Math.abs(inc-exp));$('#moneyWaste').textContent='-'+won(waste);renderMoneyCal(m);$('#moneyList').innerHTML=m.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<li data-money-id="${x.id}"><span><strong>${esc(x.title)}</strong><br><small>${x.date} · ${esc(x.category||'분류 없음')}${x.card?' · '+esc(x.card):''}</small></span><span class="amount ${x.type==='income'?'income':'expense'}">${x.type==='income'?'+':'-'}${won(x.amount)}</span></li>`).join('')||'<li><span>기록이 없어요.</span></li>'}
function renderMoneyCal(records){const root=$('#moneyCal');root.innerHTML='';['mon','tue','wed','thu','fri','sat','sun'].forEach(x=>root.insertAdjacentHTML('beforeend',`<div class="wd ${x==='sat'||x==='sun'?'weekend':''}">${x}</div>`));const first=new Date(moneyView.getFullYear(),moneyView.getMonth(),1),start=new Date(first);start.setDate(first.getDate()-((first.getDay()+6)%7));for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d), day=records.filter(x=>x.date===k), inc=day.some(x=>x.type==='income'), exp=day.some(x=>x.type==='expense');root.insertAdjacentHTML('beforeend',`<button class="moneyDay ${inc&&exp?'both':inc?'incomeOnly':exp?'expenseOnly':''} ${d.getMonth()!==moneyView.getMonth()?'mute':''} ${k===key(today)?'today':''}"><span class="moneyNum">${d.getDate()}</span></button>`)}}
function openMoney(id=''){editingMoney=id;const x=money.find(m=>m.id===id);$('#deleteMoney').hidden=!id;$('#moneyDate').value=x?.date||key(today);$('#moneyType').value=x?.type||'expense';$('#moneyTitleInput').value=x?.title||'';$('#moneyAmount').value=x?.amount||'';$('#moneyCategory').value=x?.category||'';$('#moneyCard').value=x?.card||'';$('#moneyWasteCheck').checked=!!x?.waste;$('#moneySheet').hidden=false}
function saveMoneyEntry(e){e.preventDefault();const obj={id:editingMoney||uid(),date:$('#moneyDate').value,type:$('#moneyType').value,title:$('#moneyTitleInput').value.trim(),amount:Number(String($('#moneyAmount').value).replace(/,/g,'')||0),category:$('#moneyCategory').value.trim(),card:$('#moneyCard').value.trim(),waste:$('#moneyWasteCheck').checked};const i=money.findIndex(x=>x.id===obj.id);if(i>=0)money[i]=obj;else money.push(obj);$('#moneySheet').hidden=true;saveMoney()}
function exportMoney(){const blob=new Blob([JSON.stringify({version:1,money},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`sharelog-money-${key(today)}.json`;a.click();URL.revokeObjectURL(a.href)}
function importMoney(file){const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);money=Array.isArray(data)?data:(data.money||[]);saveMoney();alert('복원했어요.')}catch(e){alert('복원 실패: '+e.message)}};r.readAsText(file)}
$$('.navBtn').forEach(b=>b.onclick=()=>page(b.dataset.target));$$('.jump').forEach(b=>b.onclick=()=>page(b.dataset.target));$('#prevCal').onclick=()=>{calView=new Date(calView.getFullYear(),calView.getMonth()-1,1);schedules=[];renderCalendar();loadSchedules(true)};$('#nextCal').onclick=()=>{calView=new Date(calView.getFullYear(),calView.getMonth()+1,1);schedules=[];renderCalendar();loadSchedules(true)};$('#todayCal').onclick=()=>{calView=new Date(today.getFullYear(),today.getMonth(),1);selected=key(today);loadSchedules(false)};$('#calGrid').onclick=e=>{const d=e.target.closest('[data-date]');if(d){selected=d.dataset.date;renderDetail()}};$('#reloadCalendar').onclick=()=>loadSchedules(false);$('#prevMoney').onclick=()=>{moneyView=new Date(moneyView.getFullYear(),moneyView.getMonth()-1,1);renderMoney()};$('#nextMoney').onclick=()=>{moneyView=new Date(moneyView.getFullYear(),moneyView.getMonth()+1,1);renderMoney()};$('#todayMoney').onclick=()=>{moneyView=new Date(today.getFullYear(),today.getMonth(),1);renderMoney()};$('#openMoney').onclick=()=>openMoney();$('#closeMoney').onclick=()=>$('#moneySheet').hidden=true;$('#moneyForm').onsubmit=saveMoneyEntry;$('#moneyList').onclick=e=>{const li=e.target.closest('[data-money-id]');if(li)openMoney(li.dataset.moneyId)};$('#deleteMoney').onclick=()=>{money=money.filter(x=>x.id!==editingMoney);$('#moneySheet').hidden=true;saveMoney()};$('#openSettings').onclick=()=>{const c=getConfig();$('#workerName').value=c.workerName||'';$('#workerId').value=c.workerId||'';$('#secretKey').value=c.secret||'';$('#settingsSheet').hidden=false};$('#closeSettings').onclick=()=>$('#settingsSheet').hidden=true;$('#saveSettings').onclick=()=>{setConfig({workerName:$('#workerName').value.trim(),workerId:$('#workerId').value.trim(),secret:$('#secretKey').value.trim()});$('#settingsSheet').hidden=true;loadSchedules(false)};$('#loadCalendarNow').onclick=()=>loadSchedules(false);$('#exportMoney').onclick=exportMoney;$('#backupQuick').onclick=exportMoney;$('#importMoney').onchange=e=>{if(e.target.files[0])importMoney(e.target.files[0])};$('#todayText').textContent=`${key(today)} · schedule shared · money local`;renderCalendar();renderMoney();renderHome();if(getConfig().workerName&&getConfig().workerId&&getConfig().secret)loadSchedules(true);else setTimeout(()=>$('#openSettings').click(),250);if('serviceWorker' in navigator)navigator.serviceWorker.register('./sharelog-sw.js').catch(()=>{});
